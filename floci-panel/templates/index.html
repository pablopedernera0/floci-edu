<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floci Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --aws-dark:    #1a2332;
    --aws-darker:  #131c2b;
    --aws-orange:  #f90;
    --aws-sidebar: #1e2a3a;
    --aws-text:    #e8edf3;
    --aws-muted:   #8899aa;
  }

  body { background: #f4f6f8; margin: 0; font-family: 'Segoe UI', sans-serif; font-size: 14px; }

  /* ── Topbar ── */
  .topbar {
    background: var(--aws-dark);
    color: var(--aws-text);
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo { font-size: 15px; font-weight: 600; color: var(--aws-text); }
  .topbar-logo span { color: var(--aws-orange); }
  .topbar-region {
    margin-left: auto;
    font-size: 12px;
    color: var(--aws-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .topbar-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #2ecc71; display: inline-block;
  }

  /* ── Layout ── */
  .layout { display: flex; min-height: calc(100vh - 48px); }

  /* ── Sidebar ── */
  .sidebar {
    width: 200px;
    background: var(--aws-sidebar);
    padding: 16px 0;
    flex-shrink: 0;
  }
  .sidebar-label {
    font-size: 11px;
    color: var(--aws-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 4px 16px 8px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    color: var(--aws-muted);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    text-decoration: none;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.05); color: var(--aws-text); }
  .sidebar-item.active {
    color: var(--aws-orange);
    background: rgba(255,153,0,0.08);
    border-left-color: var(--aws-orange);
  }
  .sidebar-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── Main ── */
  .main { flex: 1; padding: 24px 28px; overflow-x: auto; }

  .breadcrumb-bar {
    font-size: 13px;
    color: #6c757d;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .breadcrumb-bar .link {
    color: #0073bb;
    cursor: pointer;
    text-decoration: none;
  }
  .breadcrumb-bar .link:hover { text-decoration: underline; }
  .breadcrumb-bar .sep { color: #adb5bd; }

  .page-title {
    font-size: 20px;
    font-weight: 600;
    color: #1a2332;
    margin-bottom: 16px;
  }

  /* ── Stat cards ── */
  .stat-card {
    background: #fff;
    border: 1px solid #dde1e7;
    border-radius: 8px;
    padding: 14px 18px;
  }
  .stat-label { font-size: 12px; color: #6c757d; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #1a2332; }

  /* ── Tabla ── */
  .panel-table {
    width: 100%;
    background: #fff;
    border: 1px solid #dde1e7;
    border-radius: 8px;
    overflow: hidden;
    border-collapse: separate;
    border-spacing: 0;
  }
  .panel-table thead th {
    background: #f8f9fa;
    font-size: 12px;
    font-weight: 600;
    color: #6c757d;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 14px;
    border-bottom: 1px solid #dde1e7;
    text-align: left;
  }
  .panel-table tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid #f0f2f5;
    color: #2c3340;
    vertical-align: middle;
  }
  .panel-table tbody tr:last-child td { border-bottom: none; }
  .panel-table tbody tr:hover { background: #f8f9fa; }

  /* ── Bucket card clickeable ── */
  .bucket-row { cursor: pointer; }
  .bucket-name-link { color: #0073bb; font-weight: 500; text-decoration: none; }
  .bucket-name-link:hover { text-decoration: underline; }

  /* ── Badges ── */
  .badge-type {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    background: #e8f0fe;
    color: #1a56db;
    font-weight: 400;
  }

  /* ── Thumb ── */
  .obj-thumb {
    width: 36px; height: 36px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid #dde1e7;
    cursor: pointer;
  }
  .obj-thumb-placeholder {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: #f0f2f5;
    display: flex; align-items: center; justify-content: center;
    color: #adb5bd; font-size: 18px;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 48px 0;
    color: #6c757d;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  /* ── Loading ── */
  .loading { text-align: center; padding: 40px; color: #6c757d; }

  /* ── Error ── */
  .alert-floci {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 8px;
    padding: 12px 16px;
    color: #856404;
    font-size: 13px;
    margin-bottom: 16px;
  }

  /* ── Modal preview ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow: auto;
  }
  .modal-box img { max-width: 100%; border-radius: 6px; }
  .modal-box .meta { font-size: 12px; color: #6c757d; margin-top: 10px; }

  /* ── IAM ── */
  .arn-cell { font-size: 11px; font-family: monospace; color: #6c757d; }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><polyline points="3 7 12 11 21 7"/><line x1="12" y1="11" x2="12" y2="21"/></svg>
  <span class="topbar-logo">floci<span>panel</span></span>
  <div class="topbar-region">
    <span class="topbar-dot"></span>
    Floci conectado &nbsp;·&nbsp; {{ region }}
  </div>
</div>

<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-label">Servicios</div>
    <a class="sidebar-item active" id="nav-s3" onclick="showSection('s3')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
      S3
    </a>
    <a class="sidebar-item" id="nav-iam" onclick="showSection('iam')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      IAM
    </a>
  </nav>

  <!-- Main -->
  <main class="main" id="main-content">
    <!-- contenido dinámico -->
  </main>

</div>

<!-- Modal preview -->
<div class="modal-overlay" id="preview-modal" onclick="closeModal(event)">
  <div class="modal-box" id="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-weight:600; font-size:14px;" id="modal-title">Preview</span>
      <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#6c757d;">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const ENDPOINT = "{{ endpoint }}";
let currentBucket = null;

// ── Navegación ────────────────────────────────────────────────────────────────
function showSection(section) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + section).classList.add('active');
  if (section === 's3') renderS3Home();
  if (section === 'iam') renderIAM();
}

// ── Utilidades ────────────────────────────────────────────────────────────────
function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
}

function isImage(key) {
  return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(key);
}

function loading() {
  return `<div class="loading">
    <div class="spinner-border spinner-border-sm text-secondary me-2"></div>
    Cargando...
  </div>`;
}

// ── S3 Home — lista de buckets ────────────────────────────────────────────────
async function renderS3Home() {
  currentBucket = null;
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="breadcrumb-bar">S3</div>
    <div class="page-title">Buckets de S3</div>
    ${loading()}
  `;

  try {
    const resp = await fetch('/api/buckets');
    const data = await resp.json();

    if (data.error) throw new Error(data.error);

    const buckets = data.buckets;
    const rows = buckets.length === 0
      ? `<tr><td colspan="3"><div class="empty-state">
           <div class="icon">🪣</div>
           <div>No hay buckets creados todavía.</div>
         </div></td></tr>`
      : buckets.map(b => `
          <tr class="bucket-row" onclick="renderBucket('${b.name}')">
            <td><a class="bucket-name-link">${b.name}</a></td>
            <td>${formatDate(b.created)}</td>
            <td>us-east-1</td>
          </tr>`).join('');

    main.innerHTML = `
      <div class="breadcrumb-bar">S3</div>
      <div class="page-title">Buckets de S3</div>
      <div class="row g-3 mb-4">
        <div class="col-auto">
          <div class="stat-card">
            <div class="stat-label">Total de buckets</div>
            <div class="stat-value">${buckets.length}</div>
          </div>
        </div>
      </div>
      <table class="panel-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Fecha de creación</th>
            <th>Región</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } catch (e) {
    main.innerHTML += `<div class="alert-floci">⚠️ No se pudo conectar con Floci: ${e.message}</div>`;
  }
}

// ── S3 — objetos de un bucket ─────────────────────────────────────────────────
async function renderBucket(bucket) {
  currentBucket = bucket;
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="breadcrumb-bar">
      <a class="link" onclick="renderS3Home()">S3</a>
      <span class="sep">›</span>
      <span>${bucket}</span>
    </div>
    <div class="page-title">${bucket}</div>
    ${loading()}
  `;

  try {
    const resp = await fetch(`/api/buckets/${bucket}/objects`);
    const data = await resp.json();

    if (data.error) throw new Error(data.error);

    const objects = data.objects;
    const rows = objects.length === 0
      ? `<tr><td colspan="5"><div class="empty-state">
           <div class="icon">📂</div>
           <div>El bucket está vacío.</div>
         </div></td></tr>`
      : objects.map(obj => {
          const ext = obj.key.split('.').pop().toLowerCase();
          const thumb = isImage(obj.key)
            ? `<img class="obj-thumb" src="/api/buckets/${bucket}/objects/${obj.key}/url"
                    onerror="this.style.display='none'"
                    onclick="previewObject('${bucket}','${obj.key}','${formatBytes(obj.size)}','${formatDate(obj.last_modified)}')">`
            : `<div class="obj-thumb-placeholder">📄</div>`;
          return `
            <tr>
              <td>${thumb}</td>
              <td><a class="bucket-name-link" onclick="previewObject('${bucket}','${obj.key}','${formatBytes(obj.size)}','${formatDate(obj.last_modified)}')">${obj.key}</a></td>
              <td>${formatBytes(obj.size)}</td>
              <td>${formatDate(obj.last_modified)}</td>
              <td><span class="badge-type">${ext}</span></td>
            </tr>`;
        }).join('');

    main.innerHTML = `
      <div class="breadcrumb-bar">
        <a class="link" onclick="renderS3Home()">S3</a>
        <span class="sep">›</span>
        <span>${bucket}</span>
      </div>
      <div class="page-title">${bucket}</div>
      <div class="row g-3 mb-4">
        <div class="col-auto">
          <div class="stat-card">
            <div class="stat-label">Objetos</div>
            <div class="stat-value">${objects.length}</div>
          </div>
        </div>
        <div class="col-auto">
          <div class="stat-card">
            <div class="stat-label">Tamaño total</div>
            <div class="stat-value">${formatBytes(objects.reduce((a,o) => a + o.size, 0))}</div>
          </div>
        </div>
      </div>
      <table class="panel-table">
        <thead>
          <tr>
            <th style="width:52px;"></th>
            <th>Nombre (key)</th>
            <th>Tamaño</th>
            <th>Última modificación</th>
            <th>Tipo</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } catch (e) {
    main.innerHTML += `<div class="alert-floci">⚠️ Error al listar objetos: ${e.message}</div>`;
  }
}

// ── Preview de imagen ─────────────────────────────────────────────────────────
async function previewObject(bucket, key, size, date) {
  if (!isImage(key)) return;
  document.getElementById('modal-title').textContent = key;
  document.getElementById('modal-content').innerHTML = `
    <div style="text-align:center;">
      <div class="spinner-border text-secondary"></div>
    </div>`;
  document.getElementById('preview-modal').classList.add('open');

  try {
    const resp = await fetch(`/api/buckets/${bucket}/objects/${key}/url`);
    const data = await resp.json();
    document.getElementById('modal-content').innerHTML = `
      <img src="${data.url}" alt="${key}">
      <div class="meta">
        <strong>Key:</strong> ${key} &nbsp;·&nbsp;
        <strong>Tamaño:</strong> ${size} &nbsp;·&nbsp;
        <strong>Modificado:</strong> ${date}
      </div>`;
  } catch (e) {
    document.getElementById('modal-content').innerHTML = `<div class="alert-floci">No se pudo cargar la imagen.</div>`;
  }
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('preview-modal')) {
    document.getElementById('preview-modal').classList.remove('open');
  }
}

// ── IAM ───────────────────────────────────────────────────────────────────────
async function renderIAM() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="breadcrumb-bar">IAM</div>
    <div class="page-title">Usuarios IAM</div>
    ${loading()}
  `;

  try {
    const resp = await fetch('/api/iam/users');
    const data = await resp.json();

    if (data.error) throw new Error(data.error);

    const users = data.users;
    const rows = users.length === 0
      ? `<tr><td colspan="3"><div class="empty-state">
           <div class="icon">👤</div>
           <div>No hay usuarios IAM creados todavía.</div>
         </div></td></tr>`
      : users.map(u => `
          <tr>
            <td><strong>${u.username}</strong></td>
            <td class="arn-cell">${u.arn}</td>
            <td>${formatDate(u.created)}</td>
          </tr>`).join('');

    main.innerHTML = `
      <div class="breadcrumb-bar">IAM</div>
      <div class="page-title">Usuarios IAM</div>
      <div class="row g-3 mb-4">
        <div class="col-auto">
          <div class="stat-card">
            <div class="stat-label">Usuarios</div>
            <div class="stat-value">${users.length}</div>
          </div>
        </div>
      </div>
      <table class="panel-table">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>ARN</th>
            <th>Creado</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } catch(e) {
    main.innerHTML += `<div class="alert-floci">⚠️ Error al listar usuarios: ${e.message}</div>`;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderS3Home();
</script>

</body>
</html>
